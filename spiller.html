<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Løsningsfilm</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; }
  iframe { display: block; width: 100%; height: 100%; border: 0; }
  p { color: #ddd; font: 16px Arial, sans-serif; text-align: center; padding-top: 40vh; margin: 0; }
</style>
</head>
<body>
<script>
/* Liten spillerside for appen «Kartlegging og forkurs».
   Legg denne fila på en nettside (https://). Appen åpner den slik: spiller.html?v=<YouTube-ID>
   Da får YouTube en nettadresse å forholde seg til, og filmen kan spilles inne i appen
   også når appen er åpnet som fil på elevens maskin. */
var id = (new URLSearchParams(location.search).get("v") || "").replace(/[^\w-]/g, "");
if (/^[\w-]{11}$/.test(id)) {
  var f = document.createElement("iframe");
  f.src = "https://www.youtube-nocookie.com/embed/" + id + "?rel=0&autoplay=1&playsinline=1";
  f.title = "Løsningsfilm";
  f.allow = "autoplay; encrypted-media; picture-in-picture; fullscreen";
  f.allowFullscreen = true;
  f.referrerPolicy = "strict-origin-when-cross-origin";
  document.body.appendChild(f);
} else {
  document.body.innerHTML = "<p>Ingen film er valgt.</p>";
}
</script>
</body>
</html>
